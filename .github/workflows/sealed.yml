# Sealed check (U19a): runs gstack-pregate sealed over every pull request's commits, before review.
# It runs on pull_request_target, so the default branch's copy of this file runs and a pull request cannot edit, skip or
# conflict its way out of its own check. It also runs on every push to main and scans the pushed range (before..after), so
# content that reached main without a clear pull request scan, such as a merge while the check was red, still fails a run. The pull request is only read as data: its head is checked out without credentials,
# the token can only read, and the job runs gstack's checker, fetched at a pinned commit, with Bun's env-file and bunfig
# loading off. The checker reads the pull request through git objects alone, so the job deletes the checked-out files first:
# no tsconfig.json, package.json or other file from the pull request sits where Bun looks. No code from the pull request runs,
# which is why allow-unsafe-pr-checkout can let fork pull requests past checkout's guard. Bun is downloaded at a pinned
# version, from the release or, when GitHub's release download fails four times, from npm, and checked against a pinned
# SHA-256 before it runs.
# .git/info/attributes sets "* diff", which outranks any .gitattributes in the pull request and treats files with NUL bytes
# as text, so every added line reaches the checker's text rules.
# The policy is the base's .gstack/pregate.json joined with the head's: a pull request or push can tighten it, never relax
# it. The base is a commit the head cannot choose: the default branch's tip for a pull request, and the default branch as it
# stood before the push (github.event.before) for a push. Before the scan the job points origin/<default>, where the checker
# reads the base policy and the waivers in .gstack/sealed-allow.tsv, at that commit. So a pull request that loosens the
# policy or adds a waiver is still judged under the old policy, and so is the push that merges it (GST-254). The job passes
# only on a clear verdict under that policy, and U1's sealed config sets visibility public, so any finding fails it. The
# verdict pattern writes its colon as [:] so this file does not trip the checker's answer marker.
# This backs up the pre-push check and cannot unpublish a pushed commit. A run whose verdict line says "refused" is an incident:
# close the pull request, delete the branch, burn the named held-out items (record their digests as burned) and write a wiki
# finding with counts and digests only. A verdict of "error" means a sealed policy to fix (gstack-pregate validate) or a diff
# too large for the checker's buffer (or, on a push, a force-push whose old head is gone), and a clear verdict that names no origin/<default> policy means the default branch lost
# its sealed key. A red run with no verdict line, such as a failed Bun or gstack fetch, is an infrastructure failure to rerun.
name: sealed

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Keep the pull request's files off the disk
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          test "$(ls -A)" = .git
      - name: Install Bun from the release zip, or from npm if GitHub's download keeps failing, checked against a pinned SHA-256
        # Four tries at the release zip over about two minutes (waits of 15, 30 and 60 seconds), then the same version's npm
        # package. Either archive must match its pinned digest before it is unpacked, and the step fails unless the binary
        # reports BUN_VERSION. Both archives hold the same binary (sha256 10702245766b225e70bbf6235fd6b47214fd94b4760d00ffaed8ab0df57ac235).
        env:
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c # bun-linux-x64.zip in the release's SHASUMS256.txt
          BUN_NPM_SHA256: 93ca5a2abe45f3bcac6dd55baff8bb06c4ac824b70f89650b54e5c8b80dbef18 # @oven/bun-linux-x64-1.4.4.tgz on registry.npmjs.org (its dist.integrity is sha512-CHbbkmHVM28T1GFq+6GL4Ao4ujwwYwj1CxFFwEFzLanPfNsId9AhbIP0Q4reWuWBkGimUkoQygrK7Rgjtj3vog==)
        run: |
          for delay in 15 30 60 end; do
            curl -fsSL --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip" && break
            rm -f "$RUNNER_TEMP/bun.zip"
            [ "$delay" = end ] && break
            echo "::warning::The Bun release download failed; trying again in ${delay}s"
            sleep "$delay"
          done
          if [ -f "$RUNNER_TEMP/bun.zip" ]; then
            printf '%s  %s\n' "$BUN_SHA256" "$RUNNER_TEMP/bun.zip" | sha256sum -c --strict -
            unzip -q -o "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          else
            echo "::warning::The Bun release download failed 4 times, so this job installs @oven/bun-linux-x64@$BUN_VERSION from registry.npmjs.org"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/bun.tgz" "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-$BUN_VERSION.tgz"
            printf '%s  %s\n' "$BUN_NPM_SHA256" "$RUNNER_TEMP/bun.tgz" | sha256sum -c --strict -
            mkdir -p "$RUNNER_TEMP/bun-linux-x64"
            tar -xzf "$RUNNER_TEMP/bun.tgz" -C "$RUNNER_TEMP/bun-linux-x64" --strip-components=2 package/bin/bun
          fi
          test -x "$RUNNER_TEMP/bun-linux-x64/bun"
          test "$("$RUNNER_TEMP/bun-linux-x64/bun" --version)" = "$BUN_VERSION"
          printf '%s\n' "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Fetch gstack at the pinned commit
        env:
          GSTACK_SHA: 68410828fd85611caea2c8429846f683849f425a # gstack v1.93.17.0
        run: |
          git init -q "$RUNNER_TEMP/gstack"
          git -C "$RUNNER_TEMP/gstack" fetch -q --depth 1 https://github.com/garrytan/gstack.git "$GSTACK_SHA"
          git -C "$RUNNER_TEMP/gstack" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/gstack" rev-parse HEAD)" = "$GSTACK_SHA"
      - name: Diff every added line as text
        run: |
          attributes="$(git rev-parse --git-path info/attributes)"
          mkdir -p "$(dirname "$attributes")"
          printf '* diff\n' > "$attributes"
      - name: Pin the base policy to a commit the head cannot choose
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          POLICY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          policy="refs/remotes/origin/$POLICY_BRANCH"
          test "$EVENT" != push || policy="$BEFORE"
          policy="$(git rev-parse --verify "$policy^{commit}")"
          git update-ref "refs/remotes/origin/$POLICY_BRANCH" "$policy"
          printf 'policy commit: %s\n' "$policy"
      - name: gstack-pregate sealed over the pull request's or the push's commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          bun --no-env-file --config=/dev/null "$RUNNER_TEMP/gstack/bin/gstack-pregate" sealed --range "$BASE_SHA..$HEAD_SHA" --base "$POLICY_BRANCH" | tee "$RUNNER_TEMP/sealed.txt"
          grep -Eq "^SEALED[:] clear .*policy=origin/$POLICY_BRANCH( |\$)" "$RUNNER_TEMP/sealed.txt" || { echo "sealed: no clear verdict under origin/$POLICY_BRANCH's policy" >&2; exit 1; }
