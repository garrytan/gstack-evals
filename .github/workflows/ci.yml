# Keyless CI: typecheck, unit tests, the reason-code doc and the wiki check. Nothing here needs a secret.
# Actions are pinned to commit SHAs; Bun is pinned by bun-version.
# Later units add tests under tests/; `bun test` picks them up without a change here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Reason-code doc is fresh (docs/errors.md from src/errors/codes.ts)
        run: bun run errors:check
      - name: Wiki check (front matter, links, attachments, secrets, sealed markers, index, merged posts unchanged)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run wiki:check --base "$BASE"
