# The Docker tier (CI plan v5, U20; stage m1b of gate/manifest.json): the Docker-backed tests of U3, U9 and U10, the R5
# egress and R6 sealed-store probes (tests/rig/rig-probes.test.ts) and the test refusing unpinned installs under docker/, run
# with GSTACK_EVALS_DOCKER=1 and no credential in the env. gstack-evals rig tier counts a skipped or failing case, or an
# expected test file missing from the report, as RED and exits 2 (E_RIG_RED).
# It runs on pull requests and pushes to main that touch the rig, and on workflow_dispatch. Train records cover stage m0
# only, so every main push on these paths runs it. A pull request's run checks out the PR head so reviewers see the head's
# tier, but it never admits: a pull_request run takes this file from the PR's merge commit, whose base can be any branch.
# rig admit reads push and dispatch runs only, which take this file from the commit they prove (docs/rig.md).
# It posts no check of its own (GST-254): the token is read-only and no step writes to GitHub. The tier job annotates its
# summary (title gstack-evals-rig-tier), which gstack-evals rig admit reads back with the run's path, event, head and
# conclusion (src/rig/admission.ts), and uploads rig-tier.json with the JUnit report as an artifact for people.
name: rig

on:
  pull_request:
    paths:
      - src/trial/**
      - src/adapters/**
      - src/runner/**
      - src/rig/**
      - lanes/**
      - schema/**
      - docker/**
      - bun.lock
      - package.json
      - gate/manifest.json
      - tests/trial/**
      - tests/adapters/**
      - tests/proxy/**
      - tests/rig/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - src/trial/**
      - src/adapters/**
      - src/runner/**
      - src/rig/**
      - lanes/**
      - schema/**
      - docker/**
      - bun.lock
      - package.json
      - gate/manifest.json
      - tests/trial/**
      - tests/adapters/**
      - tests/proxy/**
      - tests/rig/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rig-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin Docker to the rig's engine and use the containerd image store
        # The runner ships Docker 28.0.4 on the classic store, whose image exporter ignores rewrite-timestamp, so a no-cache
        # rebuild stamps each COPY layer with the clock. Docker 28.0.4 on the containerd store refuses rewrite-timestamp
        # ("conflicts with unpack"). These are the versions the Capy rig runs; the tier then rebuilds arm images byte-identically.
        env:
          DOCKER_VERSION: 5:29.9.2-1~ubuntu.24.04~noble
          CONTAINERD_VERSION: 2.4.2-3~ubuntu.24.04~noble
          BUILDX_VERSION: 0.38.1-1~ubuntu.24.04~noble
          DOCKER_KEY_SHA256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570 # download.docker.com/linux/ubuntu/gpg, key 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/docker.asc" https://download.docker.com/linux/ubuntu/gpg
          printf '%s  %s\n' "$DOCKER_KEY_SHA256" "$RUNNER_TEMP/docker.asc" | sha256sum -c --strict -
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo install -m 0644 "$RUNNER_TEMP/docker.asc" /etc/apt/keyrings/docker.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/docker.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends --allow-downgrades "docker-ce=$DOCKER_VERSION" "docker-ce-cli=$DOCKER_VERSION" "containerd.io=$CONTAINERD_VERSION" "docker-buildx-plugin=$BUILDX_VERSION"
          { if [ -s /etc/docker/daemon.json ]; then sudo cat /etc/docker/daemon.json; else echo '{}'; fi; } | jq '.features["containerd-snapshotter"] = true' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version --format 'docker server {{.Server.Version}}, client {{.Client.Version}}'
          docker buildx version
          docker info --format '{{.Driver}} {{json .DriverStatus}}'
          test "$(docker version --format '{{.Server.Version}}')" = 29.9.2
          docker info --format '{{json .DriverStatus}}' | grep -qF io.containerd.snapshotter.v1
      - name: Install Bun from the release zip, or from npm if GitHub's download keeps failing, checked against a pinned SHA-256
        # Four tries at the release zip over about two minutes (waits of 15, 30 and 60 seconds), then the same version's npm
        # package. Either archive must match its pinned digest before it is unpacked, and the step fails unless the binary
        # reports BUN_VERSION. Both archives hold the same binary (sha256 10702245766b225e70bbf6235fd6b47214fd94b4760d00ffaed8ab0df57ac235).
        env:
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c # bun-linux-x64.zip in the release's SHASUMS256.txt
          BUN_NPM_SHA256: 93ca5a2abe45f3bcac6dd55baff8bb06c4ac824b70f89650b54e5c8b80dbef18 # @oven/bun-linux-x64-1.4.4.tgz on registry.npmjs.org (its dist.integrity is sha512-CHbbkmHVM28T1GFq+6GL4Ao4ujwwYwj1CxFFwEFzLanPfNsId9AhbIP0Q4reWuWBkGimUkoQygrK7Rgjtj3vog==)
        run: |
          for delay in 15 30 60 end; do
            curl -fsSL --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip" && break
            rm -f "$RUNNER_TEMP/bun.zip"
            [ "$delay" = end ] && break
            echo "::warning::The Bun release download failed; trying again in ${delay}s"
            sleep "$delay"
          done
          if [ -f "$RUNNER_TEMP/bun.zip" ]; then
            printf '%s  %s\n' "$BUN_SHA256" "$RUNNER_TEMP/bun.zip" | sha256sum -c --strict -
            unzip -q -o "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          else
            echo "::warning::The Bun release download failed 4 times, so this job installs @oven/bun-linux-x64@$BUN_VERSION from registry.npmjs.org"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/bun.tgz" "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-$BUN_VERSION.tgz"
            printf '%s  %s\n' "$BUN_NPM_SHA256" "$RUNNER_TEMP/bun.tgz" | sha256sum -c --strict -
            mkdir -p "$RUNNER_TEMP/bun-linux-x64"
            tar -xzf "$RUNNER_TEMP/bun.tgz" -C "$RUNNER_TEMP/bun-linux-x64" --strip-components=2 package/bin/bun
          fi
          test -x "$RUNNER_TEMP/bun-linux-x64/bun"
          test "$("$RUNNER_TEMP/bun-linux-x64/bun" --version)" = "$BUN_VERSION"
          printf '%s\n' "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Free disk for the enforced arm's install
        # ceo-enforced-armed.test.ts installs gstack 4743132 with its own ./setup (about 1.3 GB) and copies it into one session
        # home at a time, beside the Docker images the tier builds. The runner ships SDKs the tier never uses; this drops them.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Fetch the enforced CEO arm's gstack at its pinned commit and check its tree
        # tests/trial/review/ceo-enforced.test.ts and ceo-enforced-armed.test.ts run the CEO stage 2 enforced arm on this tree
        # (src/trial/review/skill-gates.ts ENFORCED_GSTACK_SHA). This step runs nothing from the tree. The armed test installs it
        # with its own keyless ./setup into a scratch HOME, as the keyless rig does. Without the tree both files skip, and the
        # tier counts a skipped case as RED, so the tier never passes on them silently.
        env:
          ENFORCED_GSTACK_SHA: 4743132ca027d487fb02bb5f8ce94f2816ff8e7c # gstack v1.96.0.0
          ENFORCED_GSTACK_TREE: 9340ccf599e3c6dbb550ca2cef5b24a5a36aefa3 # that commit's git tree id
        run: |
          git init -q "$RUNNER_TEMP/gstack-enforced"
          git -C "$RUNNER_TEMP/gstack-enforced" fetch -q --depth 1 https://github.com/garrytan/gstack.git "$ENFORCED_GSTACK_SHA"
          git -C "$RUNNER_TEMP/gstack-enforced" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/gstack-enforced" rev-parse HEAD)" = "$ENFORCED_GSTACK_SHA"
          test "$(git -C "$RUNNER_TEMP/gstack-enforced" rev-parse 'HEAD^{tree}')" = "$ENFORCED_GSTACK_TREE"
          test -z "$(git -C "$RUNNER_TEMP/gstack-enforced" status --porcelain)"
      - name: Docker tier (stage m1b), keyless
        env:
          OUTCOME_GSTACK_ENFORCED_PIN: ${{ runner.temp }}/gstack-enforced
        run: bin/gstack-evals rig tier --out "$RUNNER_TEMP/rig-tier"
      - name: Keep the tier record and JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gstack-evals-rig-tier
          path: ${{ runner.temp }}/rig-tier
          if-no-files-found: warn
          retention-days: 30
